<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daniel Rafael | Fotógrafo</title>
<meta name="description" content="">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--bg2:#121212;--card:#161616;--tx:#cfcfcf;--wh:#f5f5f5;--gold:#efe7bf;--line:rgba(239,231,191,.22)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{background:var(--bg);color:var(--tx);font-family:Montserrat,system-ui,sans-serif;font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
.serif{font-family:'Cormorant Garamond',Georgia,serif}

/* Cabeçalho */
header{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:14px 36px;transition:background .3s,padding .3s}
header.solid{background:rgba(10,10,10,.88);backdrop-filter:blur(10px);padding:8px 36px;border-bottom:1px solid rgba(255,255,255,.06)}
.brand img{height:54px;width:auto;transition:height .3s}
header.solid .brand img{height:44px}
.brand-text{font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--gold)}
nav{display:flex;align-items:center;gap:34px}
nav a{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--wh);position:relative;padding:6px 0}
nav a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:0;background:var(--gold);transition:width .3s}
nav a:hover::after{width:100%}
nav a.btn-nav{border:1px solid var(--gold);color:var(--gold);padding:9px 20px;border-radius:2px}
nav a.btn-nav::after{display:none}
nav a.btn-nav:hover{background:var(--gold);color:#000}
.burger{display:none;background:none;border:0;cursor:pointer;width:40px;height:40px}
.burger i{display:block;height:2px;background:var(--wh);margin:6px 8px}

/* Hero */
.hero{position:relative;min-height:100vh;display:flex;align-items:center;background:#000 center 42%/cover no-repeat}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.88) 0%,rgba(0,0,0,.55) 42%,rgba(0,0,0,.05) 80%),linear-gradient(0deg,rgba(0,0,0,.7),transparent 35%)}
.hero .in{position:relative;z-index:2;padding:120px 36px 90px;max-width:760px;margin-left:max(0px,calc((100vw - 1240px)/2))}
.eyebrow{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);margin-bottom:18px;display:flex;align-items:center;gap:14px}
.eyebrow::before{content:"";width:38px;height:1px;background:var(--gold)}
.hero h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(44px,7vw,92px);line-height:1.02;color:var(--wh);margin-bottom:22px}
.hero p{max-width:520px;font-size:16px;color:#d8d8d8;margin-bottom:34px}
.btns{display:flex;flex-wrap:wrap;gap:14px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 30px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;border:1px solid var(--gold);border-radius:2px;transition:.25s;cursor:pointer;font-family:inherit}
.btn.fill{background:var(--gold);color:#0a0a0a}
.btn.fill:hover{background:#fff;border-color:#fff}
.btn.ghost{color:var(--gold);background:transparent}
.btn.ghost:hover{background:rgba(239,231,191,.12)}
.cue{position:absolute;z-index:2;bottom:26px;left:50%;transform:translateX(-50%);width:22px;height:36px;border:1px solid var(--line);border-radius:12px}
.cue::after{content:"";position:absolute;left:50%;top:7px;width:2px;height:7px;margin-left:-1px;background:var(--gold);animation:cue 1.6s infinite}
@keyframes cue{0%{opacity:0;transform:translateY(0)}40%{opacity:1}100%{opacity:0;transform:translateY(12px)}}

/* Blocos */
section{padding:110px 28px}
.wrap{max-width:1180px;margin:0 auto}
h2{font-family:'Cormorant Garamond',serif;font-weight:500;color:var(--wh);font-size:clamp(32px,4vw,50px);line-height:1.1;margin-bottom:22px}
.txt p+p{margin-top:14px}
.block{display:grid;grid-template-columns:1.05fr .95fr;gap:90px;align-items:center;margin-bottom:130px}
.block:last-child{margin-bottom:0}
.block.solo{grid-template-columns:1fr;max-width:760px;margin-left:auto;margin-right:auto}
.block.rev{grid-template-columns:.95fr 1.05fr}
.block.rev .txt{order:2}
.frame{position:relative}
.frame::after{content:"";position:absolute;inset:18px -18px -18px 18px;border:1px solid var(--line);z-index:0}
.block.rev .frame::after{inset:18px 18px -18px -18px}
.frame img{position:relative;z-index:1;width:100%;aspect-ratio:4/5;object-fit:cover}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.tags span{border:1px solid var(--line);padding:5px 15px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}

/* Galeria */
.gallery{background:var(--bg2)}
.gallery .head{text-align:center;margin-bottom:54px}
.gallery .eyebrow{justify-content:center}.gallery .eyebrow::after{content:"";width:38px;height:1px;background:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding-bottom:64px}
.grid button{display:block;width:100%;margin:0;padding:0;border:0;background:#161616;cursor:zoom-in;overflow:hidden;position:relative;aspect-ratio:3/4;opacity:0;transform:translateY(40px) scale(.97);transition:opacity 1s cubic-bezier(.2,.7,.2,1),transform 1s cubic-bezier(.2,.7,.2,1)}
.grid button:nth-child(3n+2){top:64px}
.grid button.in{opacity:1;transform:none}
.grid img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 30%;transform:scale(1.001);transition:transform 1.1s cubic-bezier(.2,.7,.2,1),filter .5s;filter:grayscale(.12)}
.grid button::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(0deg,rgba(0,0,0,.45),transparent 45%);opacity:0;transition:opacity .5s;pointer-events:none}
.grid button::after{content:"";position:absolute;inset:0;z-index:2;border:1px solid transparent;transition:border-color .4s,inset .4s;pointer-events:none}
.grid button:hover::before{opacity:1}
.grid button:hover::after{border-color:var(--gold);inset:12px}
.grid button:hover img{transform:scale(1.07);filter:none}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr);gap:10px;padding-bottom:36px}.grid button:nth-child(3n+2){top:0}.grid button:nth-child(2n){top:36px}}
.more{text-align:center;margin-top:44px}

/* Chamada */
.callout{background:var(--gold);color:#1a1a1a;text-align:center;padding:100px 28px}
.callout .eyebrow{color:#1a1a1a;justify-content:center}.callout .eyebrow::before,.callout .eyebrow::after{background:#1a1a1a;content:"";width:38px;height:1px}
.callout h2{color:#0a0a0a;max-width:820px;margin:0 auto 20px}
.callout p{max-width:640px;margin:0 auto 34px}
.callout .btn{background:#0a0a0a;color:var(--gold);border-color:#0a0a0a}
.callout .btn:hover{background:transparent;color:#0a0a0a}

/* Contato (foto à direita) */
.contact .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:80px;align-items:center}
form{display:grid;gap:18px;margin-top:26px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
label{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#9c9c9c;display:grid;gap:8px}
input,textarea{width:100%;background:transparent;border:0;border-bottom:1px solid #3a3a3a;color:var(--wh);font:inherit;font-size:15px;padding:10px 2px;outline:none;border-radius:0}
input:focus,textarea:focus{border-color:var(--gold)}
textarea{min-height:110px;resize:vertical}
form .btn{justify-self:start;margin-top:6px}
.hint{font-size:12px;color:#777}
.infos{display:grid;gap:6px;margin-top:34px;font-size:14px}
.infos a{color:var(--gold)}.infos a:hover{text-decoration:underline}
.portrait{position:relative}
.portrait::before{content:"";position:absolute;inset:-16px 16px 16px -16px;border:1px solid var(--line)}
.portrait img{position:relative;width:100%;aspect-ratio:4/5;object-fit:cover}

/* Rodapé */
footer{background:#050505;padding:64px 28px 40px;text-align:center;font-size:13px;color:#8a8a8a;border-top:1px solid rgba(255,255,255,.06)}
footer img{height:64px;margin:0 auto 18px}
footer .links{display:flex;gap:26px;justify-content:center;margin:18px 0 22px;font-size:12px;letter-spacing:.2em;text-transform:uppercase}
footer .links a:hover{color:var(--gold)}

.wa{position:fixed;right:22px;bottom:22px;z-index:50;width:56px;height:56px;border-radius:50%;background:#25d366;display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.5);transition:.2s}
.wa:hover{transform:scale(1.08)}
.wa svg{width:30px;height:30px;fill:#fff}

/* Lightbox */
.lb{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.95);display:none;align-items:center;justify-content:center}
.lb.on{display:flex}
.lb img{max-height:92vh;max-width:92vw;object-fit:contain}
.lb button{position:absolute;background:none;border:0;color:#fff;font-size:38px;cursor:pointer;padding:14px 20px;opacity:.75}
.lb button:hover{opacity:1}
.lb .x{top:6px;right:8px}.lb .p{left:6px;top:50%}.lb .n{right:6px;top:50%}
.lb .c{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:12px;color:#aaa}

.reveal{opacity:0;transform:translateY(24px);transition:opacity .8s,transform .8s}
.reveal.in{opacity:1;transform:none}

@media(max-width:900px){
  header,header.solid{padding:10px 18px}
  .burger{display:block}
  nav{position:fixed;inset:0 0 0 auto;width:78%;max-width:320px;background:#0d0d0d;flex-direction:column;justify-content:center;gap:28px;transform:translateX(100%);transition:transform .35s;border-left:1px solid var(--line)}
  nav.open{transform:none}
  .brand img{height:42px}
  .hero .in{padding:110px 22px 80px}
  .hero::before{background:linear-gradient(0deg,rgba(0,0,0,.92) 10%,rgba(0,0,0,.35) 70%)}
  section{padding:70px 20px}
  .block,.block.rev,.contact .wrap{grid-template-columns:1fr;gap:44px}
  .block.rev .txt{order:0}
  .block{margin-bottom:90px}
  .contact .wrap .portrait{order:-1}
  .row2{grid-template-columns:1fr}
  .frame::after,.block.rev .frame::after{inset:12px -8px -12px 8px}
  .portrait::before{inset:-10px 10px 10px -10px}
}
@media(prefers-reduced-motion:reduce){.grid button{opacity:1;transform:none;transition:none}.reveal{opacity:1;transform:none;transition:none}.cue::after{animation:none}}
/* formas */
.grid button{border-radius:20px}
.grid button::after{border-radius:10px}
@media(max-width:700px){.grid button{border-radius:14px}.grid button::after{border-radius:6px}}
/* hero mobile */
@media(max-width:900px){.hero{display:block;min-height:0;padding-top:392px;background-color:#000;background-repeat:no-repeat;background-size:auto 520px;background-position:100% 52px!important}.hero::before{background:linear-gradient(0deg,#000 4%,rgba(0,0,0,.75) 30%,rgba(0,0,0,0) 62%)}.hero .in{padding:0 22px 72px}}
</style>
</head>
<body>

<header id="hd">
  <a class="brand" href="#inicio" id="brand"></a>
  <button class="burger" id="burger" aria-label="Menu"><i></i><i></i><i></i></button>
  <nav id="nav"></nav>
</header>

<main>
  <div class="hero" id="inicio">
    <div class="in">
      <div class="eyebrow" id="h-eyebrow"></div>
      <h1 id="h-title"></h1>
      <p id="h-sub"></p>
      <div class="btns"><a class="btn fill" id="h-btn" target="_blank" rel="noopener"></a><a class="btn ghost" id="h-btn2" href="#fotografias"></a></div>
    </div>
    <div class="cue"></div>
  </div>

  <section><div class="wrap" id="blocos"></div></section>

  <section class="gallery" id="fotografias">
    <div class="wrap">
      <div class="head"><div class="eyebrow" id="g-eyebrow"></div><h2 id="g-title"></h2></div>
      <div class="grid" id="grid"></div>
      <div class="more"><button class="btn ghost" id="more" hidden></button></div>
    </div>
  </section>

  <div class="callout">
    <div class="eyebrow" id="c-eyebrow"></div>
    <h2 id="c-title"></h2>
    <p id="c-text"></p>
    <a class="btn" id="c-btn" target="_blank" rel="noopener"></a>
  </div>

  <section class="contact" id="contato">
    <div class="wrap">
      <div>
        <div class="eyebrow" id="k-eyebrow"></div>
        <h2 id="k-title"></h2>
        <form id="form">
          <div class="row2">
            <label>Nome *<input name="nome" required autocomplete="name"></label>
            <label>Telefone *<input name="tel" type="tel" required autocomplete="tel"></label>
          </div>
          <label>E-mail<input name="email" type="email" autocomplete="email"></label>
          <label>Mensagem *<textarea name="msg" required></textarea></label>
          <button class="btn fill" type="submit" id="k-btn"></button>
          <p class="hint" id="k-hint"></p>
        </form>
        <div class="infos" id="infos"></div>
      </div>
      <div class="portrait"><img id="k-img" alt="" loading="lazy"></div>
    </div>
  </section>
</main>

<footer>
  <div id="f-logo"></div>
  <p id="f-desc"></p>
  <div class="links" id="f-links"></div>
  <p id="f-copy"></p>
</footer>

<a class="wa" id="wa" target="_blank" rel="noopener" aria-label="WhatsApp">
  <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
</a>

<div class="lb" id="lb" aria-hidden="true">
  <button class="x" aria-label="Fechar">×</button>
  <button class="p" aria-label="Anterior">‹</button>
  <img alt="">
  <button class="n" aria-label="Próxima">›</button>
  <div class="c"></div>
</div>

<script src="content.js"></script>
<script>
(function(){
const C = window.CONTENT;
if(!C){document.body.innerHTML='<p style="padding:40px;color:#fff">Não foi possível carregar o conteúdo do site (content.js).</p>';return}
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const wa=(txt)=>'https://wa.me/'+String(C.contato_info.whatsapp||'').replace(/\D/g,'')+(txt?'?text='+encodeURIComponent(txt):'');
const paragraphs=(box,text)=>{box.textContent='';String(text||'').split(/\n\s*\n/).forEach(p=>{if(p.trim())box.appendChild(el('p',null,p.trim()))})};

// SEO / marca
document.title=C.seo.titulo||document.title;
document.querySelector('meta[name=description]').content=C.seo.descricao||'';
const og=document.createElement('meta');og.setAttribute('property','og:image');og.content=new URL(C.hero.foto,location.href).href;document.head.appendChild(og);
const ogt=document.createElement('meta');ogt.setAttribute('property','og:title');ogt.content=C.seo.titulo||'';document.head.appendChild(ogt);
if(C.marca.favicon){const l=document.createElement('link');l.rel='icon';l.href=C.marca.favicon;document.head.appendChild(l)}
if(C.marca.logo){const i=el('img');i.src=C.marca.logo;i.alt=C.marca.nome||'Logo';$('brand').appendChild(i);const f=el('img');f.src=C.marca.logo;f.alt=C.marca.nome||'Logo';$('f-logo').appendChild(f)}
else{$('brand').appendChild(el('span','brand-text',C.marca.nome||''))}

// Menu
const nav=$('nav');
[['#inicio',C.menu.inicio],['#fotografias',C.menu.fotos],['#contato',C.menu.contato]].forEach(([h,t])=>{const a=el('a',null,t);a.href=h;nav.appendChild(a)});
const nb=el('a','btn-nav',C.menu.botao||'WhatsApp');nb.href=wa(C.contato.mensagem_whatsapp);nb.target='_blank';nb.rel='noopener';nav.appendChild(nb);
$('burger').onclick=()=>nav.classList.toggle('open');
nav.addEventListener('click',e=>{if(e.target.tagName==='A')nav.classList.remove('open')});
const hd=$('hd');const sc=()=>hd.classList.toggle('solid',window.scrollY>60);sc();addEventListener('scroll',sc,{passive:true});

// Hero
document.querySelector('.hero').style.backgroundPosition='center '+(C.hero.posicao==null||C.hero.posicao===''?42:Math.max(0,Math.min(100,+C.hero.posicao)))+'%';document.querySelector('.hero').style.backgroundImage="url('"+C.hero.foto+"')";
$('h-eyebrow').textContent=C.hero.etiqueta;$('h-title').textContent=C.hero.titulo;$('h-sub').textContent=C.hero.subtitulo;
$('h-btn').textContent=C.hero.botao+'  →';$('h-btn').href=wa(C.contato.mensagem_whatsapp);
$('h-btn2').textContent=C.hero.botao2;

// Blocos
(C.blocos||[]).forEach((b,i)=>{
  const d=el('div','block reveal'+(i%2?' rev':''));
  const t=el('div','txt');
  t.appendChild(el('div','eyebrow',b.etiqueta));
  t.appendChild(el('h2',null,b.titulo));
  const pb=el('div');paragraphs(pb,b.texto);t.appendChild(pb);
  const tags=String(b.tags||'').split(',').map(s=>s.trim()).filter(Boolean);
  if(tags.length){const tg=el('div','tags');tags.forEach(x=>tg.appendChild(el('span',null,x)));t.appendChild(tg)}
  d.appendChild(t);
  if(b.foto){const fr=el('div','frame');const im=el('img');im.src=b.foto;im.alt=b.titulo||'';im.loading='lazy';fr.appendChild(im);d.appendChild(fr)}else d.classList.add('solo');
  $('blocos').appendChild(d);
});

// Galeria
const G=C.galeria,fotos=G.fotos||[];
$('g-eyebrow').textContent=G.etiqueta;$('g-title').textContent=G.titulo;
const grid=$('grid');let shown=0;const step=Math.max(1,parseInt(G.inicial)||12);
const gio=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');gio.unobserve(x.target)}}),{threshold:.08,rootMargin:'0px 0px -4% 0px'});
function more(){
  const end=Math.min(fotos.length,shown+(shown?fotos.length:step));
  for(let i=shown;i<end;i++){
    const b=el('button');b.setAttribute('aria-label','Abrir foto '+(i+1));
    const im=el('img');im.src=fotos[i].src;im.alt=fotos[i].alt||('Foto '+(i+1)+' - '+(C.marca.nome||''));im.loading='lazy';im.decoding='async';
    b.appendChild(im);b.onclick=()=>openLb(i);b.style.transitionDelay=((i-shown)%3)*110+'ms';grid.appendChild(b);gio.observe(b);
  }
  shown=end;
  const mb=$('more');
  if(shown>=fotos.length)mb.hidden=true;else{mb.hidden=false;mb.textContent=(G.botao_mais||'Ver todas as fotos')+' ('+fotos.length+')'}
}
$('more').onclick=more;more();

// Lightbox
const lb=$('lb'),li=lb.querySelector('img'),lc=lb.querySelector('.c');let cur=0;
const show=()=>{li.src=fotos[cur].src;lc.textContent=(cur+1)+' / '+fotos.length};
function openLb(i){cur=i;show();lb.classList.add('on');lb.setAttribute('aria-hidden','false')}
const closeLb=()=>{lb.classList.remove('on');lb.setAttribute('aria-hidden','true')};
const go=d=>{cur=(cur+d+fotos.length)%fotos.length;show()};
lb.querySelector('.x').onclick=closeLb;lb.querySelector('.p').onclick=()=>go(-1);lb.querySelector('.n').onclick=()=>go(1);
lb.addEventListener('click',e=>{if(e.target===lb)closeLb()});
document.addEventListener('keydown',e=>{if(!lb.classList.contains('on'))return;if(e.key==='Escape')closeLb();if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1)});

// Chamada
$('c-eyebrow').textContent=C.chamada.etiqueta;$('c-title').textContent=C.chamada.titulo;$('c-text').textContent=C.chamada.texto;
$('c-btn').textContent=C.chamada.botao+'  →';$('c-btn').href=wa(C.contato.mensagem_whatsapp);

// Contato
$('k-eyebrow').textContent=C.contato.etiqueta;$('k-title').textContent=C.contato.titulo;
$('k-btn').textContent=C.contato.botao+'  →';$('k-hint').textContent=C.contato.aviso;
const ki=$('k-img');ki.src=C.contato.foto;ki.alt=C.marca.nome||'';
const infos=$('infos');
const addInfo=(label,text,href)=>{if(!text)return;const d=el('div');d.appendChild(el('span',null,label+': '));if(href){const a=el('a',null,text);a.href=href;a.target='_blank';a.rel='noopener';d.appendChild(a)}else d.appendChild(document.createTextNode(text));infos.appendChild(d)};
const num=String(C.contato_info.whatsapp||'').replace(/\D/g,'');
addInfo('WhatsApp',num.length>=12?'('+num.slice(2,4)+') '+num.slice(4,num.length-4)+'-'+num.slice(-4):num,wa(''));
addInfo('Instagram','@'+String(C.contato_info.instagram||'').replace(/\/$/,'').split('/').pop(),C.contato_info.instagram);
if(C.contato_info.email)addInfo('E-mail',C.contato_info.email,'mailto:'+C.contato_info.email);
addInfo('Atendimento',C.contato_info.cidade);
$('form').addEventListener('submit',e=>{
  e.preventDefault();const f=new FormData(e.target);
  const t=(C.contato.mensagem_whatsapp||'Olá! Vim pelo site.')+'\n\nNome: '+f.get('nome')+'\nTelefone: '+f.get('tel')+'\nE-mail: '+(f.get('email')||'-')+'\nMensagem: '+f.get('msg');
  window.open(wa(t),'_blank','noopener');
});

// Rodapé
$('f-desc').textContent=C.rodape.descricao;
const fl=$('f-links');
[['Instagram',C.contato_info.instagram],['WhatsApp',wa('')]].forEach(([t,h])=>{const a=el('a',null,t);a.href=h;a.target='_blank';a.rel='noopener';fl.appendChild(a)});
$('f-copy').textContent='© '+new Date().getFullYear()+' '+(C.rodape.copyright||C.marca.nome||'');
$('wa').href=wa(C.contato.mensagem_whatsapp);

// Animação ao rolar
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.12});
document.querySelectorAll('.reveal').forEach(x=>io.observe(x));
})();
</script>
</body>
</html>
